# =============================================================================
# catalog.toml — catálogo curado de modelos GGUF para descarga
#
# Campos por modelo:
#   id          — identificador corto único
#   name        — nombre legible
#   type        — chat | embedding | coding | multimodal
#   hf_repo     — repositorio en HuggingFace (<org>/<repo>)
#   hf_file     — archivo .gguf dentro del repo
#   size_gb     — tamaño aproximado del archivo descargado
#   ram_gb      — RAM mínima recomendada para inferencia
#   dest_dir    — subdirectorio dentro de /srv/models/
#   description — descripción breve
# =============================================================================

# -----------------------------------------------------------------------------
