# =============================================================================
# Perfil de CPU: Intel Ivy Bridge (3ª generación)
#
# Aplicable a:
#   Core i7-3xxxQM / i5-3xxxM / i3-3xxxM
#   Xeon E3-12xx v2
#
# Extensiones verificadas (/proc/cpuinfo):
#   SSE4.1, SSE4.2, AVX, F16C  — SÍ
#   AVX2, FMA3, BMI1, BMI2     — NO (pre-Haswell)
#   AVX-512                    — NO
#
# Equipos conocidos con este procesador:
#   Apple Mac mini 6,2 (i7-3615QM)
# =============================================================================

[cpu]
name    = "Intel Ivy Bridge"
vendor  = "intel"
arch    = "ivybridge"
gen     = "3rd"

# Extensiones SIMD soportadas
sse41  = true
sse42  = true
avx    = true
f16c   = true

# Extensiones NO soportadas (Haswell+)
avx2   = false
fma3   = false
bmi1   = false
bmi2   = false
avx512 = false

# =============================================================================
# Configuración del compilador
# =============================================================================

[compiler]
march = "ivybridge"
mtune = "ivybridge"

# AVX + F16C, sin FMA3 / BMI1 / BMI2 / AVX2.
#
# Historia (ver ADR-005 y ADR-007): el SIGILL original venía de GGML_BMI2, que
# ggml tiene en ON por defecto cuando GGML_NATIVE=OFF, no de AVX. En ese
# momento también se apagaron AVX y F16C "por si acaso", y el binario quedó en
# SSE4.2 puro: en el Mac mini 6,2 (Bastion) daba 1.8 tok/s de generación con
# qwen2.5-3b q4_k_m. Con AVX+F16C, mismo commit de llama.cpp: 10.8 tok/s.
#
# En ggml cada extensión es una opción independiente (-mavx, -mf16c, -mfma,
# -mbmi2); encender AVX no arrastra FMA ni BMI2. Los -mno-* que quedan son la
# segunda barrera para lo que Ivy Bridge NO tiene.
#
# Verificación del binario (debe dar 0 en BMI2/FMA/AVX2 y >0 en ymm):
#   objdump -d llama-server | grep -cE "shlx|vfmadd|vpbroadcast"   → 0
cflags = "-O3 -ffast-math -fno-finite-math-only -mno-avx2 -mno-fma -mno-bmi -mno-bmi2"

# =============================================================================
# Flags cmake de extensiones CPU
# Estos flags controlan qué código SIMD compila ggml.
# Los flags de hardware (BLAS, METAL, etc.) van en el build.toml del equipo.
# =============================================================================

[cmake.flags]
# GGML_BMI2=OFF es crítico: ggml-cpu/CMakeLists.txt lo tiene en ON por defecto
# y lo inyecta vía target_compile_options() pisando CMAKE_C_FLAGS.
# Ver docs/architecture/decisions.md ADR-005 y docs/troubleshooting/common-issues.md
GGML_AVX    = "ON"    # Ivy Bridge sí tiene AVX (256 bits): ×6 en generación
GGML_F16C   = "ON"    # conversión fp16↔fp32 en hardware (KV cache fp16)
GGML_AVX2   = "OFF"
GGML_BMI2   = "OFF"   # default ON en ggml → SIGILL (SHLX) en Ivy Bridge
GGML_FMA    = "OFF"   # Ivy Bridge no tiene FMA3
GGML_AVX512 = "OFF"
GGML_NATIVE = "OFF"
