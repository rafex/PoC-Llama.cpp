# =============================================================================
# Perfil de compilación: Apple Mac mini 6,2
#
# Hardware identificado con:
#   sudo dmidecode -t system   → Macmini6,2 / Apple Inc.
#   lscpu                      → Intel Core i7-3615QM (Ivy Bridge, 4C/8T)
#
# La configuración del procesador (march, mtune, cflags, GGML_AVX, GGML_BMI2...)
# se hereda de:
#   build/templates/cpu/intel/ivybridge.toml
#
# Este archivo solo contiene lo específico del equipo:
#   hardware, jobs, dependencias y flags de hardware (BLAS, METAL...).
# =============================================================================

inherits = "cpu/intel/ivybridge"

[hardware]
manufacturer   = "Apple Inc."
product        = "Macmini6,2"
cpu_model      = "Intel Core i7-3615QM"
cpu_arch       = "ivybridge"
logical_cpus   = 8
physical_cores = 4
os             = "linux"

[build]
jobs      = 8
type      = "Release"
generator = "Unix Makefiles"

[dependencies]
# Binarios verificados con `command -v`
commands = ["git", "cmake", "gcc", "g++", "pkg-config"]
# Librerías verificadas con `pkg-config --exists`
pkg_config = ["openblas", "openssl"]
# Paquetes sugeridos para instalar (solo referencia, no se instalan automáticamente)
apt_packages = [
  "build-essential",
  "cmake",
  "git",
  "libopenblas-dev",
  "libssl-dev",
  "pkg-config",
  "libvulkan-dev",
  "vulkan-tools",
  "mesa-vulkan-drivers",
]

# Flags cmake específicos del hardware.
# Los flags de CPU (GGML_AVX, GGML_BMI2, compiler.*) vienen de ivybridge.toml.
[cmake.flags]
BUILD_SHARED_LIBS    = "OFF"
GGML_BLAS            = "ON"
GGML_BLAS_VENDOR     = "OpenBLAS"
GGML_METAL           = "OFF"
GGML_VULKAN          = "OFF" # Cambiar a ON si se desea aceleración GPU con Intel HD Graphics 4000 vía Vulkan
LLAMA_BUILD_TESTS    = "OFF"
LLAMA_BUILD_EXAMPLES = "ON"

